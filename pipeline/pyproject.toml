[project]
name = "crecrm-pipeline"
version = "0.1.0"
description = "CRECRM land/parcel enrichment pipeline: ArcGIS REST harvester + local PostGIS cache"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "shapely>=2.0",
]

[project.scripts]
enrichment = "enrichment.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enrichment*"]

[tool.setuptools.package-data]
enrichment = ["sql/*.sql", "sources.yml"]
