# The local PostGIS cache the harvester writes to. Port 5433 so it never
# collides with a local dev Postgres on 5432.
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: crecrm-gis
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    ports:
      - "5433:5432"
    volumes:
      - gis-data:/var/lib/postgresql/data

volumes:
  gis-data:
